<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Widget</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .cliente-mockup {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }
        h1 { color: #111827; }
        p { color: #4b5563; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="cliente-mockup">
        <h1>O Meu Site Fictício</h1>
        <p>Bem-vindo ao nosso site. Por favor, utilize o calendário abaixo para fazer a sua marcação connosco.</p>

        <!-- BOOKING PLACEHOLDER DO WIDGET -->
        <div id="reserva-widget" 
          data-empresa-id="162fabe5-eebe-431d-a13e-6a7b91b94061"
          data-tipo="hotel"
          data-checkin="16:00"
          data-checkout="11:00"
          data-color="#10b981"> <!-- Mude esta cor para ver o widget mudar! -->
        </div>
        
        <!-- Script que chama o seu widget localmente -->
        <script>
            // Forçamos o baseUrl para usar os ficheiros locais neste teste em vez do GitHub Pages
            document.currentScript.src = window.location.origin + window.location.pathname.replace('test_widget.html', 'widget/widget.js');
        </script>
        <script src="./widget/widget.js" defer></script>
        
    </div>

</body>
</html>
