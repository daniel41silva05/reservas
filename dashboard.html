<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema Central de Reservas</title>
    <link rel="stylesheet" href="./css/style.css?v=2">
    <link rel="stylesheet" href="./css/dashboard.css?v=2">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Flatpickr (Custom Date Picker) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FullCalendar JS CDN -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
</head>

<body>
    <!-- Background Glow Effects -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2><span>Sistema</span> Reservas<span>.</span></h2>
            </div>

            <nav class="sidebar-nav">
                <ul id="navLinks">
                    <li id="navEmpresas" class="hidden" data-view="empresas"><i
                            class="fa-solid fa-building fa-fw"></i><span>Empresas</span></li>
                    <li data-view="recursos"><i class="fa-solid fa-cubes fa-fw"></i><span>Recursos</span></li>
                    <li data-view="precos"><i class="fa-solid fa-tag fa-fw"></i><span>Preços</span></li>
                    <li data-view="bloqueios"><i class="fa-solid fa-calendar-xmark fa-fw"></i><span>Bloqueios</span>
                    </li>
                    <li data-view="reservas"><i class="fa-solid fa-list fa-fw"></i><span>Ver Reservas</span></li>
                    <li data-view="nova_reserva"><i class="fa-solid fa-calendar-plus fa-fw"></i><span>Nova
                            Reserva</span></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button id="sidebarToggle" class="btn-icon sidebar-toggle-btn" title="Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="topbar-brand">Sistema<span>.</span></span>
                </div>
                <div class="topbar-right">
                    <div id="companyContextWrapper" class="company-context hidden">
                        <!-- Selector for Admin, Text for owner -->
                    </div>

                    <div class="user-profile">
                        <span id="userEmail" class="text-sub">Carregando...</span>
                        <button id="logoutBtn" class="btn-icon btn-logout" title="Sair do sistema"><i
                                class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </div>
            </header>

            <div class="content-area" id="contentArea">
                <!-- Dynamic Content Loading Area -->
                <div class="glass-panel" style="padding: 2rem;">
                    <p class="text-sub">Carregando dados...</p>
                </div>
            </div>
        </main>

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
    </div>

    <!-- Global Confirm Modal -->
    <div id="globalConfirmModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="modal-title" id="confirmModalTitle">Confirmação</h3>
            <p class="modal-message" id="confirmModalMessage">Tem a certeza que deseja prosseguir?</p>
            <div class="modal-actions">
                <button id="btnConfirmCancel" class="btn btn-secondary">Cancelar</button>
                <button id="btnConfirmAccept" class="btn btn-primary"
                    style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3);">Apagar</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="./env.js"></script>
    <script type="module" src="./js/supabase-config.js"></script>
    <script type="module" src="./js/dashboard.js"></script>
</body>

</html>
